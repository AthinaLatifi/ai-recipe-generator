# .github/workflows/lint.yml
# Runs a quick Python syntax check and import test on every push or pull request.
# This catches obvious errors before the deploy workflow fires.

name: Lint & Syntax Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask python-dotenv google-genai flake8

      - name: Run flake8 (style + syntax)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          # E9: syntax errors, F63: invalid assert, F7: undefined names, F82: undefined names
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check app imports cleanly
        run: |
          # Verify the app module can be imported without errors
          GEMINI_API_KEY=test python -c "import app; print('Import OK')"
